<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HealthNet v2 - Dashboard</title>

  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body onload="initDashboard(); initLayout(); routeGuard();">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-logo">
      <img src="../assets/images/logos/logo.png">
      <h3>HealthNet</h3>
    </div>

    <!-- USER SIDEBAR -->
    <div class="sidebar-user">
      <img class="sidebar-avatar" src="">
      <div>
        <p id="userName">Usuario</p>
        <small id="userRole">ROL</small>
      </div>
    </div>

    <!-- LINKS -->
    <div class="sidebar-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="pacientes.html">Pacientes</a>
      <a href="diagnostico.html">Diagnósticos</a>
      <a href="historial.html">Historial</a>
      <a href="hospitales.html">Hospitales</a>
      <a href="users.html">Usuarios</a>
      <a href="reportes.html">Reportes</a>
    </div>

    <!-- FOOTER -->
    <div class="sidebar-footer">
      <button onclick="logout()" class="logout-btn">
        Cerrar sesión
      </button>
    </div>

  </aside>

  <!-- TOPBAR -->
  <header class="topbar">

    <button class="menu-btn" onclick="toggleSidebar()">☰</button>

    <div class="topbar-title">
      <h2>Dashboard Clínico</h2>
    </div>

    <!-- USER TOPBAR -->
    <div class="topbar-user">
      <img id="topAvatar" src="">
      <div>
        <p id="topUserName">Usuario</p>
        <small id="topUserRole">ROL</small>
      </div>
    </div>

  </header>

  <!-- CONTENT -->
  <main class="content" id="content">

    <!-- KPIs -->
    <section class="grid">

      <div class="card kpi">
        <h3>Pacientes</h3>
        <p id="kpiPatients">0</p>
      </div>

      <div class="card kpi">
        <h3>Diagnósticos</h3>
        <p id="kpiDiagnoses">0</p>
      </div>

      <div class="card kpi alert">
        <h3>Críticos</h3>
        <p id="kpiCritical">0</p>
      </div>

    </section>

    <!-- PANEL CLÍNICO -->
    <section class="grid">

      <div class="card">
        <h3>Actividad reciente</h3>
        <div id="activityFeed"></div>
      </div>

      <div class="card">
        <h3>Estado hospital</h3>
        <p>Hospital activo: <b id="hospitalName">General</b></p>
        <p>Usuarios conectados: 12</p>
      </div>

    </section>

  </main>

  <!-- SCRIPTS -->
  <script src="../scripts/core/router.js"></script>
  <script src="../scripts/ui/layout.js"></script>
  <script src="../scripts/modules/dashboard.js"></script>

</body>
</html>
