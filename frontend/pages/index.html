<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HealthNet v2 - Login</title>
  <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

  <div class="login-container">
    <div class="login-card">

      <img src="../assets/images/logos/logo.png" class="logo">

      <h2>Sistema Hospitalario HealthNet v2</h2>

      <input type="email" id="email" placeholder="Correo institucional">
      <input type="password" id="password" placeholder="Contraseña">

      <button onclick="handleLogin()">Ingresar</button> 
      <p id="error"></p>

    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="../scripts/core/session.js"></script>
  <script src="../scripts/core/router.js"></script>
  <script type="module">
  import { login } from "../scripts/core/auth.js";

  window.handleLogin = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await login(email, password);

    if (res.ok) {
      window.location.href = "/pages/dashboard.html";
    } else {
      alert(res.message);
    }
  };
</script>

  <script>
    // 🔐 evitar acceso si ya hay sesión activa
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("token");
      const userRaw = localStorage.getItem("user");

      if (token && userRaw) {
        try {
          const user = JSON.parse(userRaw);
          redirectByRole(user.rol);
        } catch (e) {
          localStorage.clear();
        }
      }
    });

    // =========================
    // LOGIN PRINCIPAL (FINAL)
    // =========================
    async function handleLogin() {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorEl = document.getElementById("error");
      const btn = document.getElementById("loginBtn");

      errorEl.innerText = "";

      if (!email || !password) {
        errorEl.innerText = "Completa todos los campos";
        return;
      }

      try {

        // UX: bloquear botón
        btn.disabled = true;
        btn.innerText = "Ingresando...";

        const res = await login(email, password);

        if (!res || !res.ok) {
          errorEl.innerText = res?.message || "Credenciales inválidas";
          btn.disabled = false;
          btn.innerText = "Ingresar";
          return;
        }

        // 🔥 OBLIGATORIO: validar storage real
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user || !user.rol) {
          errorEl.innerText = "Error de sesión";
          btn.disabled = false;
          btn.innerText = "Ingresar";
          return;
        }

        // 🧭 redirección segura (SIN setTimeout innecesario)
        redirectByRole(user.rol);

      } catch (err) {
        console.error("LOGIN ERROR:", err);
        errorEl.innerText = "Error de conexión";
        btn.disabled = false;
        btn.innerText = "Ingresar";
      }
    }
  </script>

</body>
</html>
